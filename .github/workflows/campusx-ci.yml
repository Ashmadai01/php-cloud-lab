name: CampusX CI

on:
  push:
    branches: [main]
    paths:
      - "campusx/**"
      - ".github/workflows/campusx-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "campusx/**"
      - ".github/workflows/campusx-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campusx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    name: PHP lint and test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: campusx

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, fileinfo, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find app tests -type f -name '*.php' -print0 |
            xargs -0 -r -n1 php -l

      - name: Run project test suite
        run: composer test

      - name: Run standalone rate limiter regression test
        if: ${{ hashFiles('campusx/tests/rate_limiter_failure.php') != '' }}
        run: php tests/rate_limiter_failure.php
